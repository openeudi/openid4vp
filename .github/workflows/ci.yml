name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  # Tests the PACKED package, not the source tree. 0.9.2 shipped a fix that was
  # inert in the published bundle while every source test passed, so source-only
  # CI cannot catch that class of regression. See scripts/smoke-package.mjs.
  package-smoke:
    name: Package Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build

      - name: Pack and install into a scratch project
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke
          tarball="$(npm pack --silent --pack-destination /tmp/smoke | tail -1)"
          echo "packed ${tarball}"
          cd /tmp/smoke
          npm init -y >/dev/null
          # --ignore-scripts: a consumer install must not depend on our lifecycle
          # scripts running, and it keeps the tarball's own deps honest.
          npm install "/tmp/smoke/${tarball}" --ignore-scripts

      - name: Smoke-test the installed package
        run: node scripts/smoke-package.mjs /tmp/smoke
